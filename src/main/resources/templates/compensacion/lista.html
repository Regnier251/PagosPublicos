<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compensaciones - Pagos Públicos</title>
</head>
<body>
    <a th:href="@{/terceros}">← Volver a Terceros</a>
    <h1>Compensaciones — <span th:text="${tercero.razonSocial}"></span></h1>

    <p th:if="${exito}" th:text="${exito}" style="color: green;"></p>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <a th:href="@{'/terceros/' + ${tercero.id} + '/compensaciones/nueva'}">+ Nueva compensación</a>

    <table border="1">
        <thead>
            <tr>
                <th>Folio</th>
                <th>Monto compensado</th>
                <th>Saldo residual</th>
                <th>Estatus</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${compensaciones}">
                <td th:text="${c.folio}"></td>
                <td th:text="${#numbers.formatDecimal(c.montoCompensado, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(c.saldoResidual, 1, 2)}"></td>
                <td th:text="${c.estatus}"></td>
                <td>
                    <a th:href="@{'/terceros/' + ${tercero.id} + '/compensaciones/' + ${c.id}}">Ver</a>
                    <form th:if="${c.estatus.name() == 'APLICADA'}"
                          th:action="@{'/terceros/' + ${tercero.id} + '/compensaciones/' + ${c.id} + '/cancelar'}"
                          method="post" style="display:inline;">
                        <button type="submit">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(compensaciones)}">
                <td colspan="5">No hay compensaciones registradas para este tercero.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
