<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera('Consultar archivos')}"></head>
<body>

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>

    <main class="contenedor">
        <a th:href="@{/archivos}">← Volver a Archivos</a>
        <h1 class="pagina__titulo">Consultar histórico de archivos</h1>
        <p class="pagina__subtitulo">Busca por nombre y/o periodo. Se requiere al menos un criterio.</p>

        <form th:action="@{/archivos/consultar}" method="get"
              style="max-width: 680px; display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem;">

            <div class="campo" style="flex: 2; min-width: 220px; margin-bottom: 0;">
                <label for="nombre">Nombre del archivo</label>
                <input type="text" id="nombre" name="nombre" th:value="${nombre}"
                       placeholder="Ej. compensaciones">
            </div>

            <div class="campo" style="flex: 1; min-width: 140px; margin-bottom: 0;">
                <label for="mes">Mes</label>
                <select id="mes" name="mes">
                    <option value="">Cualquiera</option>
                                        <option th:each="nombreMes, stat : ${meses}"
                            th:value="${stat.index + 1}"
                            th:text="${nombreMes}"
                            th:selected="${mes != null and mes == stat.index + 1}"></option>
                </select>
            </div>

            <div class="campo" style="flex: 1; min-width: 110px; margin-bottom: 0;">
                <label for="anio">Año</label>
                <input type="number" id="anio" name="anio" min="2020" max="2100"
                       th:value="${anio}" placeholder="2026">
            </div>

            <div class="acciones" style="margin-bottom: 0.4rem;">
                <button type="submit" class="boton boton--primario">Buscar</button>
                <a class="boton boton--secundario" th:href="@{/archivos/consultar}">Limpiar</a>
            </div>
        </form>

        <div class="alerta alerta--error" th:if="${errorCriterio}" th:text="${errorCriterio}"></div>

        <div th:if="${sinCriterios}" class="fila-vacia"
             style="text-align: center; color: #64748b; padding: 2rem; border: 1px dashed #cbd5e1; border-radius: 12px;">
            Define al menos un criterio de búsqueda (nombre o periodo) para consultar.
        </div>

        <div th:if="${busquedaRealizada}">
            <p style="font-size: 0.875rem; color: #64748b; margin-bottom: 0.75rem;">
                Resultados encontrados: <strong th:text="${#lists.size(archivos)}"></strong>
            </p>
            <div th:replace="~{fragmentos/tabla-archivos :: tabla(${archivos},
                    'No se encontraron archivos con los criterios indicados.')}"></div>
        </div>
    </main>
</body>
</html>
