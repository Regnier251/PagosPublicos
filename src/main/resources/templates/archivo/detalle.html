<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera('Detalle del ZIP')}"></head>
<body>

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>

    <main class="contenedor">
        <a th:href="@{/archivos}">← Volver a Archivos</a>
        <h1 class="pagina__titulo" th:text="${archivo.nombreOriginal}"></h1>
        <p class="pagina__subtitulo">
            Recibido el <span th:text="${#temporals.format(archivo.subidoEn, 'dd/MM/yyyy HH:mm')}"></span>
            ·
            <span th:text="${#numbers.formatDecimal(archivo.tamanoBytes / 1024.0, 1, 2)}"></span> KB
        </p>

        <div class="alerta alerta--exito" th:if="${tieneCompensacionPdf}">
            ✓ Este ZIP contiene <strong>compensacion.pdf</strong> — listo para verificación futura
        </div>
        <div class="alerta alerta--error" th:if="${!tieneCompensacionPdf}">
            ⚠ Este ZIP <strong>no contiene compensacion.pdf</strong>
        </div>

        <h2 class="seccion-titulo" style="margin-top: 1rem;">Contenido del comprimido</h2>
        <table class="tabla">
            <thead>
                <tr>
                    <th>Archivo</th>
                    <th>Ruta interna</th>
                    <th class="numero">Tamaño</th>
                    <th class="numero">Comprimido</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${internos}"
                    th:styleappend="${f.esPdfCompensacion()} ? 'background-color: #f0fdf4;'">
                    <td th:text="${f.nombre.substring(f.nombre.lastIndexOf('/') + 1)}"></td>
                    <td style="color: #64748b; font-size: 0.85rem;"
                        th:text="${f.nombre.contains('/')} ? ${f.nombre.substring(0, f.nombre.lastIndexOf('/'))} : 'raíz'"></td>
                    <td class="numero"
                        th:text="${#numbers.formatDecimal(f.tamanoBytes / 1024.0, 1, 2) + ' KB'}"></td>
                    <td class="numero"
                        th:text="${#numbers.formatDecimal(f.tamanoComprimido / 1024.0, 1, 2) + ' KB'}"></td>
                </tr>
                <tr class="fila-vacia" th:if="${#lists.isEmpty(internos)}">
                    <td colspan="4">El comprimido está vacío.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
