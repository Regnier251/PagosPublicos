<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera-archivo('Archivos ZIP')}"></head>
<body th:data-exito="${exito}" th:data-error="${error}">

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
            <h1 class="pagina__titulo">Archivos ZIP</h1>
            <a class="boton boton--secundario" th:href="@{/archivos/consultar}">
                🔍 Consultar histórico
            </a>
        </div>
        <p class="pagina__subtitulo">Recepciones del mes en curso — arrastra un comprimido para subirlo</p>

        <form id="form-subida" th:action="@{/archivos/subir}" method="post"
              enctype="multipart/form-data" style="margin-bottom: 2rem;">
            <div class="zona-arrastre" id="zona-arrastre" tabindex="0" role="button"
                 aria-label="Arrastra aquí un archivo ZIP o haz clic para seleccionarlo">
                <div class="zona-arrastre__contenido">
                    <span class="zona-arrastre__icono">📦</span>
                    <p class="zona-arrastre__texto">Arrastra tu archivo .zip aquí</p>
                    <p class="zona-arrastre__ayuda">o haz clic para seleccionarlo — máximo 25 MB</p>
                    <p class="zona-arrastre__archivo" id="archivo-seleccionado"></p>
                </div>
                <input type="file" id="input-archivo" name="archivo" accept=".zip" hidden>
            </div>
        </form>

        <div th:replace="~{fragmentos/tabla-archivos :: tabla(${archivos},
                'Sin recepciones este mes. Usa «Consultar histórico» para buscar en periodos anteriores.')}"></div>
    </main>

    <script th:src="@{/js/archivo-subida.js}" defer></script>
</body>
</html>
