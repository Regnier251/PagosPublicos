<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera-archivo('Archivos ZIP')}"></head>
<body th:data-exito="${exito}" th:data-error="${error}">

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>

    <main class="contenedor">
        <h1 class="pagina__titulo">Archivos ZIP</h1>
        <p class="pagina__subtitulo">Arrastra o selecciona comprimidos para su recepción y verificación</p>

        <form id="form-subida" th:action="@{/archivos/subir}" method="post"
              enctype="multipart/form-data" style="margin-bottom: 2rem;">
            <div class="zona-arrastre" id="zona-arrastre" tabindex="0" role="button"
                 aria-label="Arrastra aquí un archivo ZIP o haz clic para seleccionarlo">
                <div class="zona-arrastre__contenido">
                    <span class="zona-arrastre__icono">📦</span>
                    <p class="zona-arrastre__texto">Arrastra tu archivo .zip aquí</p>
                    <p class="zona-arrastre__ayuda">o haz clic para seleccionarlo — máximo 25 MB</p>
                    <p class="zona-arrastre__archivo" id="archivo-seleccionado"></p>
                </div>
                <input type="file" id="input-archivo" name="archivo" accept=".zip" hidden>
            </div>
        </form>

        <table class="tabla">
            <thead>
                <tr>
                    <th>Archivo</th>
                    <th class="numero">Tamaño</th>
                    <th class="numero">Archivos internos</th>
                    <th>Fecha de recepción</th>
                    <th>Estatus</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${archivos}">
                    <td th:text="${a.nombreOriginal}"></td>
                    <td class="numero"
                        th:text="${a.tamanoBytes >= 1048576
                            ? #numbers.formatDecimal(a.tamanoBytes / 1048576.0, 1, 2) + ' MB'
                            : #numbers.formatDecimal(a.tamanoBytes / 1024.0, 1, 2) + ' KB'}"></td>
                    <td class="numero" th:text="${a.totalArchivosInternos}"></td>
                    <td th:text="${#temporals.format(a.subidoEn, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span class="etiqueta"
                              th:classappend="${'etiqueta--' + #strings.toLowerCase(a.estatus)}"
                              th:text="${a.estatus}"></span>
                    </td>
                    <td><span style="color: #64748b;">Ver detalle (próximamente)</span></td>
                </tr>
                <tr class="fila-vacia" th:if="${#lists.isEmpty(archivos)}">
                    <td colspan="6">Aún no se ha recibido ningún archivo ZIP.</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script th:src="@{/js/archivo-subida.js}" defer></script>
</body>
</html>
