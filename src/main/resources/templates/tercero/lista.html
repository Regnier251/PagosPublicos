<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera('Terceros')}"></head>
<body th:data-exito="${exito}">

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h1 class="pagina__titulo">Terceros</h1>
                <p class="pagina__subtitulo">Clientes y proveedores registrados en el sistema</p>
            </div>
            <a class="boton boton--primario" th:href="@{/terceros/nuevo}">+ Nuevo tercero</a>
        </div>

        <table class="tabla">
            <thead>
                <tr>
                    <th>RFC</th>
                    <th>Razón social</th>
                    <th>Estatus</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${terceros}">
                    <td th:text="${t.rfc}"></td>
                    <td th:text="${t.razonSocial}"></td>
                    <td>
                        <span class="etiqueta"
                              th:classappend="${'etiqueta--' + #strings.toLowerCase(t.estatus)}"
                              th:text="${t.estatus}"></span>
                    </td>
                    <td>
                        <a class="boton boton--primario"
                           th:href="@{'/terceros/' + ${t.id}}">Ver detalle</a>
                    </td>
                </tr>
                <tr class="fila-vacia" th:if="${#lists.isEmpty(terceros)}">
                    <td colspan="4">No hay terceros registrados aún. Crea el primero con el botón de arriba.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
