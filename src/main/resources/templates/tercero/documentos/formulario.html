<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera('Documento')}"></head>
<body>

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>
    <nav th:replace="~{fragmentos/comunes :: menu-tercero(${tercero}, 'documentos')}"></nav>

    <main class="contenedor">
        <h1 class="pagina__titulo"
            th:text="${documento.id != null} ? 'Editar documento' : 'Nuevo documento'"></h1>
        <p class="pagina__subtitulo"
           th:text="${documento.id != null} ? 'Modifica los datos del documento' : 'Registra una factura por cobrar (CxC) o por pagar (CxP)'"></p>

        <form th:action="@{'/terceros/' + ${tercero.id} + '/documentos'}"
              th:object="${documento}" method="post" style="max-width: 560px;">
            <input type="hidden" th:field="*{id}" />

            <div class="errores-globales" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}" th:disabled="${documento.id != null}">
                    <option value="" disabled>Seleccione...</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
                <!-- En edición el select va disabled y no viaja en el submit;
                     el hidden conserva el valor original -->
                <input type="hidden" th:if="${documento.id != null}" th:field="*{tipo}" />
                <span class="error-campo" th:if="${#fields.hasErrors('tipo')}"
                      th:errors="*{tipo}"></span>
            </div>

            <div class="campo">
                <label for="folio">Folio de la factura</label>
                <input type="text" id="folio" th:field="*{folio}" maxlength="50" required>
                <span class="error-campo" th:if="${#fields.hasErrors('folio')}"
                      th:errors="*{folio}"></span>
            </div>

            <div class="campo">
                <label for="fechaEmision">Fecha de emisión</label>
                <input type="date" id="fechaEmision" th:field="*{fechaEmision}">
                <span class="error-campo" th:if="${#fields.hasErrors('fechaEmision')}"
                      th:errors="*{fechaEmision}"></span>
            </div>

            <div class="campo">
                <label for="fechaVencimiento">Fecha de vencimiento</label>
                <input type="date" id="fechaVencimiento" th:field="*{fechaVencimiento}">
                <span class="error-campo" th:if="${#fields.hasErrors('fechaVencimiento')}"
                      th:errors="*{fechaVencimiento}"></span>
            </div>

            <div class="campo">
                <label for="montoTotal">Monto total (MXN)</label>
                <input type="text" id="montoTotal" th:field="*{montoTotal}"
                       inputmode="decimal" placeholder="0.00" required>
                <span class="error-campo" th:if="${#fields.hasErrors('montoTotal')}"
                      th:errors="*{montoTotal}"></span>
            </div>

            <div class="acciones">
                <button type="submit" class="boton boton--primario">Guardar</button>
                <a class="boton boton--secundario"
                   th:href="@{'/terceros/' + ${tercero.id} + '/documentos'}">Volver</a>
            </div>
        </form>
    </main>
</body>
</html>
