<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera('Documentos')}"></head>
<body>

    <nav th:replace="~{fragmentos/comunes :: menu}"></nav>
    <nav th:replace="~{fragmentos/comunes :: menu-tercero(${tercero}, 'documentos')}"></nav>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h1 class="pagina__titulo">Documentos</h1>
                <p class="pagina__subtitulo">Facturas por cobrar (CxC) y por pagar (CxP) del tercero</p>
            </div>
            <a class="boton boton--primario"
               th:href="@{'/terceros/' + ${tercero.id} + '/documentos/nuevo'}">+ Nuevo documento</a>
        </div>

        <table class="tabla">
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Folio</th>
                    <th>F. emisión</th>
                    <th>F. vencimiento</th>
                    <th class="numero">Monto total</th>
                    <th class="numero">Saldo pendiente</th>
                    <th>Estatus</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${documentos}">
                    <td th:text="${d.tipo}"></td>
                    <td th:text="${d.folio}"></td>
                    <td th:text="${d.fechaEmision != null ? #temporals.format(d.fechaEmision, 'dd/MM/yyyy') : '—'}"></td>
                    <td th:text="${d.fechaVencimiento != null ? #temporals.format(d.fechaVencimiento, 'dd/MM/yyyy') : '—'}"></td>
                    <td class="numero" th:text="${#numbers.formatDecimal(d.montoTotal, 1, 2)}"></td>
                    <td class="numero" th:text="${#numbers.formatDecimal(d.saldoPendiente, 1, 2)}"></td>
                    <td>
                        <span class="etiqueta"
                              th:classappend="${'etiqueta--' + #strings.toLowerCase(d.estatus)}"
                              th:text="${d.estatus}"></span>
                    </td>
                    <td>
                        <div class="acciones">
                            <a class="boton boton--secundario"
                               th:href="@{'/terceros/' + ${tercero.id} + '/documentos/' + ${d.id} + '/editar'}">Editar</a>
                            <form th:if="${d.estatus.name() == 'VIGENTE'}"
                                th:action="@{'/terceros/' + ${tercero.id} + '/documentos/' + ${d.id} + '/cancelar'}"
                                method="post" style="display: inline;"
                                data-confirmar="¿Cancelar este documento? Esta acción no se puede deshacer."
                                data-confirmar-peligro>
                                <button type="submit" class="boton boton--peligro">Cancelar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr class="fila-vacia" th:if="${#lists.isEmpty(documentos)}">
                    <td colspan="8">Este tercero no tiene documentos registrados aún.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
