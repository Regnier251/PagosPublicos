<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Documentos - Pagos Públicos</title>
</head>
<body>
    <a th:href="@{/terceros}">← Volver a Terceros</a>
    <h1>Documentos — <span th:text="${tercero.razonSocial}"></span></h1>

    <p th:if="${exito}" th:text="${exito}" style="color: green;"></p>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <a th:href="@{'/terceros/' + ${tercero.id} + '/documentos/nuevo'}">+ Nuevo documento</a>

    <table border="1">
        <thead>
            <tr>
                <th>Tipo</th>
                <th>Folio</th>
                <th>F. emisión</th>
                <th>F. vencimiento</th>
                <th>Monto total</th>
                <th>Saldo pendiente</th>
                <th>Estatus</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${documentos}">
                <td th:text="${d.tipo}"></td>
                <td th:text="${d.folio}"></td>
                <td th:text="${d.fechaEmision}"></td>
                <td th:text="${d.fechaVencimiento}"></td>
                <td th:text="${#numbers.formatDecimal(d.montoTotal, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(d.saldoPendiente, 1, 2)}"></td>
                <td th:text="${d.estatus}"></td>
                <td>
                    <a th:href="@{'/terceros/' + ${tercero.id} + '/documentos/' + ${d.id} + '/editar'}">Editar</a>
                    <form th:if="${d.estatus.name() == 'VIGENTE'}"
                          th:action="@{'/terceros/' + ${tercero.id} + '/documentos/' + ${d.id} + '/cancelar'}"
                          method="post" style="display:inline;">
                        <button type="submit">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(documentos)}">
                <td colspan="8">Este tercero no tiene documentos registrados aún.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
