<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tercero - Pagos Públicos</title>
</head>
<body>
    <a th:href="@{/terceros}">← Volver a Terceros</a>

    <h1 th:text="${tercero.id != null} ? 'Editar tercero' : 'Nuevo tercero'"></h1>

    <form th:action="@{/terceros}" th:object="${tercero}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="rfc">RFC</label><br>
            <input type="text" id="rfc" th:field="*{rfc}" maxlength="13" required>
            <span th:if="${#fields.hasErrors('rfc')}" th:errors="*{rfc}"
                  style="color: red;"></span>
        </div>

        <div>
            <label for="razonSocial">Razón social</label><br>
            <input type="text" id="razonSocial" th:field="*{razonSocial}" required>
            <span th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"
                  style="color: red;"></span>
        </div>

        <button type="submit">Guardar</button>
    </form>
</body>
</html>
