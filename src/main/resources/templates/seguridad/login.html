<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabecera-seguridad('Iniciar sesión')}"></head>
<body class="login-pagina">

    <div class="login-tarjeta">
        <h1>Pagos Públicos</h1>
        <p>Ingresa tus credenciales para continuar</p>

        <div class="alerta alerta--error" th:if="${param.error}">
            Usuario o contraseña incorrectos
        </div>
        <div class="alerta alerta--exito" th:if="${param.logout}">
            Sesión cerrada correctamente
        </div>

        <form th:action="@{/seguridad}" method="post">
            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus
                       autocomplete="username">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password">
            </div>
            <button type="submit" class="boton boton--primario" style="width: 100%;">Entrar</button>
        </form>
    </div>
</body>
</html>
