spring.config.import=optional:file:.env[.properties]

spring.application.name=pagospublicos
spring.profiles.active=local
spring.jpa.open-in-view=false

# Carga de archivos (módulo ZIP)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# BD PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/pagospublicos
spring.datasource.username=pagos_app
spring.datasource.password=pagos_local

# El esquema lo crea FLYWAY, no Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Raíz de trámites de pago. Formato: ${VARIABLE_ENTORNO:valor-default}
# app.polizas.directorio-raiz=${POLIZAS_RAIZ:Z:/Tramites de pagos}

app.polizas.directorio-raiz=${POLIZAS_RAIZ:C:/pagospublicos/Tramites de pagos}

# Usuario inicial (solo se crea si la tabla usuarios está vacía)
app.seguridad.usuario-inicial=admin
app.seguridad.contrasena-inicial=${POLIZAS_ADMIN_PASS:admin123}

# ── Chatbot IA ──
# Desarrollo: OpenAI. Producción: Ollama local
app.chatbot.base-url=${POLIZAS_CHATBOT_BASEURL:https://api.openai.com/v1}
app.chatbot.api-key=${POLIZAS_CHATBOT_APIKEY}
app.chatbot.modelo=${POLIZAS_CHATBOT_MODELO:gpt-4o-mini}
# app.chatbot.modelo=${POLIZAS_CHATBOT_MODELO:llama-3.3-70b-versatile}