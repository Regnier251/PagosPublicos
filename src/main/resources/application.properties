spring.application.name=pagospublicos
spring.profiles.active=local
spring.jpa.open-in-view=false

# Carga de archivos (módulo ZIP)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# BD PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/pagospublicos
spring.datasource.username=pagos_app
spring.datasource.password=pagos_local

# El esquema lo crea FLYWAY, no Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Almacenamiento de archivos ZIP subidos (fuera del proyecto, como en un servidor real)
app.archivos.directorio-raiz=C:/pagospublicos/archivos

# Raíz de trámites de pago. Formato: ${VARIABLE_ENTORNO:valor-default}
# app.polizas.directorio-raiz=${POLIZAS_RAIZ:Z:/Tramites de pagos}

app.polizas.directorio-raiz=${POLIZAS_RAIZ:C:/pagospublicos/Tramites de pagos}